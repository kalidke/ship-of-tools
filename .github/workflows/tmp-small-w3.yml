# TEMPORARY, SMALL-066 W3, W4 and W5 on a hosted Windows runner; never merged. Pushed alone on tmp/ci-small-w3 (the
# lane head with W3), read, then the branch is deleted. Nothing here pushes, publishes or reads a secret. The steps are
# the job tmp-w3-hosted.diff adds to rust.yml, in a file of their own so the push runs only this job: the comm suites'
# home guard refuses a real junction and a real symlink to the live home on Git Bash and passes a copy, the fixed
# hub-files case builds a real link and is refused through it, and a root passed to jq with --arg comes back converted
# where --rawfile keeps it.
name: tmp small-w3
on:
  push:
    branches: [tmp/ci-small-w3]
jobs:
  tmp-w3-guard-windows:
    name: tmp W3, the home guard and a real link (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: The guard refuses a junction and a native symlink to the live home
        shell: bash
        run: |
          set +e -u  # the runner's bash runs with -e, which a refusal's rc 2 would end before its line prints
          t="$(mktemp -d)"; mkdir -p "$t/.sot-comm"
          fail=0
          refused() {  # KIND LINK: the guard on LINK/x, with HOME holding the live comm home
            out="$(HOME="$t" bash -c '. comm/tests/lib-home-guard.sh; guard_refuse_live_home "$1"; echo passed' _ "$2/x" 2>&1)"; rc=$?
            echo "w3 $1 link=$([ -L "$2" ] && echo yes || echo no) rc=$rc last=$(printf '%s\n' "$out" | tail -n 1)"
            [ "$rc" = 2 ] || fail=1
          }
          # Run 1 (38376756910): `cmd //c mklink /J` printed `Invalid switch` and made no junction. Four forms, each
          # followed by the guard on a path through it: A is W3's dir_link form, B escapes the switch from Git Bash's
          # argument conversion, C turns that conversion off, D asks PowerShell.
          src="$(cygpath -w "$t/.sot-comm")"
          cmd //c mklink /J "$(cygpath -w "$t/jA")" "$src"; echo "mk A rc=$?"; refused junction-A "$t/jA"
          cmd //c mklink //J "$(cygpath -w "$t/jB")" "$src"; echo "mk B rc=$?"; refused junction-B "$t/jB"
          MSYS_NO_PATHCONV=1 cmd /c mklink /J "$(cygpath -w "$t/jC")" "$src"; echo "mk C rc=$?"; refused junction-C "$t/jC"
          powershell -NoProfile -Command "New-Item -ItemType Junction -Path '$(cygpath -w "$t/jD")' -Target '$src' | Out-Null"; echo "mk D rc=$?"; refused junction-D "$t/jD"
          ls -la "$t"
          if MSYS=winsymlinks:nativestrict ln -s "$t/.sot-comm" "$t/symlink"; then refused symlink "$t/symlink"; else echo "w3 symlink not made"; fail=1; fi
          ln -s "$t/.sot-comm" "$t/plain" 2> /dev/null; echo "w3 plain ln -s link=$([ -L "$t/plain" ] && echo yes || echo no)"
          cp -r "$t/.sot-comm" "$t/copy"
          out="$(HOME="$t" bash -c '. comm/tests/lib-home-guard.sh; guard_refuse_live_home "$1"; echo passed' _ "$t/copy/x" 2>&1)"; rc=$?
          echo "w3 copy rc=$rc last=$(printf '%s\n' "$out" | tail -n 1)"
          [ "$rc" = 0 ] || fail=1
          exit "$fail"
      - name: W4 and W5, a root through jq --arg and through --rawfile (Git Bash converts a native program's arguments)
        if: always()
        shell: bash
        run: |
          printf '%s' /c/Users/x > "$RUNNER_TEMP/root"
          echo "w45 arg=$(jq -rn --arg r /c/Users/x '$r') rawfile=$(jq -rn --rawfile r "$RUNNER_TEMP/root" '$r')"
          echo "w45 arg-fake=$(jq -rn --arg r /fake/root '$r')"
      - name: The fixed hub-files case builds a real link and is refused through it
        if: always()
        timeout-minutes: 6
        shell: bash
        run: |
          # Run 2 (38377016418) hung in this suite past the job's limit, and a job cancelled that way keeps no log; so the
          # suite gets its own bound, and its last lines show where it stood.
          set +e
          /usr/bin/timeout -k 10 300 bash comm/tests/test-hub-files.sh > "$RUNNER_TEMP/hub.log" 2>&1; echo "hub-files rc=$?"
          grep -E 'home guard|link could|was not refused' "$RUNNER_TEMP/hub.log"
          tail -n 25 "$RUNNER_TEMP/hub.log"
          grep -qx 'PASS: the home guard refuses a live comm home, and only that' "$RUNNER_TEMP/hub.log"
