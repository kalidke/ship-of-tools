name: update-probe
# A scratch-branch workflow: the update runbook's command from each 0.6 and 0.7 start on macOS and Windows. It lives only
# on tmp/ branches, which are never merged.
on:
  push:
    branches: ["tmp/**"]
permissions:
  contents: read
jobs:
  macos:
    name: update from ${{ matrix.start }} (macOS ${{ matrix.mode }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        start: [v0.6.6-rc1, v0.6.6-rc9.13, v0.6.6-rc9.15, v0.6.6, v0.7.0]
        mode: [plain]
        include:
          - { start: v0.6.6, mode: pinned }
          - { start: v0.6.6-rc9.15, mode: token }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1.12"
      - name: jq (the installer stops without it)
        shell: bash
        run: command -v jq >/dev/null || brew install jq
      - name: the runbook from ${{ matrix.start }}
        shell: bash
        run: bash probe/update-probe.sh "${{ matrix.start }}" main "${{ matrix.mode }}" "$RUNNER_TEMP/out" "$RUNNER_TEMP/home"
      - name: logs
        if: always()
        shell: bash
        run: for f in "$RUNNER_TEMP"/out/*.out "$RUNNER_TEMP"/out/summary.txt; do echo "===== $f"; cat "$f"; done
  windows:
    name: update from ${{ matrix.start }} (Windows ${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        start: [v0.6.6-rc9.14, v0.6.6-rc9.15, v0.6.6, v0.7.0]
        mode: [plain]
        include:
          - { start: v0.6.6, mode: pinned }
          - { start: v0.6.6-rc9.15, mode: token }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1.12"
      - name: jq (agent comm needs it)
        shell: powershell
        run: if (-not (Get-Command jq -ErrorAction SilentlyContinue)) { choco install jq -y --no-progress }
      - name: the runbook from ${{ matrix.start }}
        shell: powershell
        run: ./probe/update-probe.ps1 -Start "${{ matrix.start }}" -Mode "${{ matrix.mode }}"
