name: update-probe
# A scratch-branch workflow: the update runbook's step 3, verbatim from docs/UPDATE-AGENT.md at c6ad4385e
# (probe/step3.sh, probe/sot-update.ps1, probe/run-ps.txt, probe/run-gitbash.txt), each run twice. It lives only on
# tmp/ branches, which are never merged.
on:
  push:
    branches: ["tmp/**"]
permissions:
  contents: read
jobs:
  windows:
    name: step 3 from ${{ matrix.start }} by ${{ matrix.shell }} (Windows${{ matrix.offline && ', offline first' || '' }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: v0.6.6-rc9.14, shell: powershell, offline: false }
          - { start: v0.6.6-rc9.14, shell: gitbash, offline: false }
          - { start: v0.6.6, shell: powershell, offline: true }
          - { start: v0.6.6, shell: gitbash, offline: false }
          - { start: v0.7.0, shell: powershell, offline: false }
          - { start: v0.7.0, shell: gitbash, offline: false }
          - { start: source, shell: gitbash, offline: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1.12"
      - name: jq (agent comm needs it)
        shell: powershell
        run: if (-not (Get-Command jq -ErrorAction SilentlyContinue)) { choco install jq -y --no-progress }
      - name: step 3, twice
        shell: powershell
        run: |
          $a = @{ Start = '${{ matrix.start }}'; Shell = '${{ matrix.shell }}' }
          if ('${{ matrix.offline }}' -eq 'true') { $a.Offline = $true }
          ./probe/step3-probe.ps1 @a
  macos:
    name: step 3 from ${{ matrix.start }} (macOS)
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        start: [v0.6.6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1.12"
      - name: jq (the installer stops without it)
        shell: bash
        run: command -v jq >/dev/null || brew install jq
      - name: step 3, twice
        shell: bash
        run: bash probe/step3-probe.sh "${{ matrix.start }}" "$RUNNER_TEMP/out" "$RUNNER_TEMP/home"
