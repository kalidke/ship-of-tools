name: update-probe
# A scratch-branch workflow: the update runbook on a Windows computer that ran from a source checkout (no install.json,
# no Rust toolchain, an old sot.exe alone in bin). It lives only on tmp/ branches, which are never merged.
on:
  push:
    branches: ["tmp/**"]
permissions:
  contents: read
jobs:
  windows-source:
    name: source checkout ${{ matrix.checkout }}, sot.exe ${{ matrix.oldbin }} (Windows${{ matrix.nopolicy && ', no publish list' || '' }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { checkout: v0.6.6, oldbin: v0.5.5, nopolicy: false }
          - { checkout: main, oldbin: v0.5.5, nopolicy: false }
          - { checkout: v0.6.6, oldbin: v0.5.5, nopolicy: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1.12"
      - name: jq (agent comm needs it)
        shell: powershell
        run: if (-not (Get-Command jq -ErrorAction SilentlyContinue)) { choco install jq -y --no-progress }
      - name: the runbook over a source checkout
        shell: powershell
        run: |
          $a = @{ Checkout = '${{ matrix.checkout }}'; OldBin = '${{ matrix.oldbin }}' }
          if ('${{ matrix.nopolicy }}' -eq 'true') { $a.NoPolicy = $true }
          ./probe/srcckout-probe.ps1 @a
