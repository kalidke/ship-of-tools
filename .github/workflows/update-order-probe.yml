name: update-order-probe
# A scratch-branch workflow: the daemons-before-windows commands of docs/UPDATE-AGENT.md (probe/daemons-*, probe/step5-*,
# extracted byte for byte), run against a 0.6.6 daemon. It lives only on tmp/ branches, which are never merged.
on:
  push:
    branches: ["tmp/**"]
permissions:
  contents: read
jobs:
  windows:
    name: step 2 and 5 commands (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1.12"
      - name: jq (agent comm needs it)
        shell: powershell
        run: if (-not (Get-Command jq -ErrorAction SilentlyContinue)) { choco install jq -y --no-progress }
      - name: the commands
        shell: powershell
        run: ./probe/order-probe.ps1
  macos:
    name: step 2 and 5 commands (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: "1.12"
      - name: jq (the installer stops without it)
        shell: bash
        run: command -v jq >/dev/null || brew install jq
      - name: the commands
        shell: bash
        run: bash probe/order-probe.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/home"
