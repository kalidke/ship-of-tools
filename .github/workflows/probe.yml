name: probe
# A scratch-branch workflow that runs the private-stdout tests on macOS and Windows. It lives only on tmp/ branches,
# which are never merged.
on:
  push:
    branches: ["tmp/**"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
      - name: Line tables only
        timeout-minutes: 1
        shell: bash
        run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          workspaces: rust
          shared-key: test-${{ matrix.os }}
          save-if: false
      - name: Platform's bound tests
        timeout-minutes: 15
        shell: bash
        run: cargo test -p sot-platform --locked --lib host::bound -- --test-threads=1
      - name: The drawing child's tests
        timeout-minutes: 25
        shell: bash
        run: cargo test -p sot-frontend --test svg_child --locked
