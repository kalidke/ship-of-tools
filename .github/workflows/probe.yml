name: probe
# A scratch-branch workflow that runs one platform test target on macOS. It lives only on tmp/ branches, which are
# never merged.
on:
  push:
    branches: ["tmp/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
      - name: Line tables only
        timeout-minutes: 1
        shell: bash
        run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          workspaces: rust
          shared-key: test-macos-latest
          save-if: false
      - name: The row socket tests
        timeout-minutes: 25
        shell: bash
        run: cargo test -p sot-capsule --locked --test row -- --nocapture
