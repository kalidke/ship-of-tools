# Rust CI (ADR 0030 §3): build + test on the blocking platforms.
#
# Runs on pushes to main, tags, and on demand -- NOT on pull requests
# (owner ruling 2026-09-08: waiting on hosted CI per PR was the workflow's
# slowest step and burned the Actions allowance; a change merges on its
# local suites, the windows-gnu cross-check and its review round, and CI on
# main is the backstop. A tag is never cut unless main's CI is green.
# Windows-only frontend code that cannot be cross-compiled on the backend
# runs this workflow on its branch by hand: `gh workflow run rust.yml --ref
# <branch>`.)
#
# Deliberately NO `cargo fmt --check` / `clippy -D warnings` yet — the
# workspace predates the gate and isn't fmt/clippy-clean; normalizing it is a
# fleet-coordinated one-time pass (would conflict with in-flight branches).
# Add both steps here when that lands.
# The one clippy gate is function length (the step below).
#
# macOS IS in this matrix (added after v0.5.9's release build failed on it).
# The old rationale for leaving it out — "a private repo burns 10x Actions
# minutes" — died at the public flip: public repos get free GitHub-hosted
# runners, macOS included. And it was never actually non-blocking: release.yml
# lists macos-aarch64 with experimental:false, so a macOS failure SKIPS the
# publish job and kills the whole release. Testing it only at tag time meant
# the tag was the first place anyone learned it was broken, with no way to
# fix it in place. Pre-merge is where that belongs.

name: Rust

on:
  push:
    branches: [main]
    # scripts/** is here because this workflow carries the launcher parse steps:
    # without it, a script-only PR — exactly the class that needs parsing — never
    # triggers them. Proven by PR #82 (a ps1-only hotfix) running zero Rust checks.
    # comm/** added alongside the "Test sot-comm disambiguation" step below
    # (PR #148 Codex review F10) — without it, a comm-only change (like the
    # one that added that step) would never trigger this workflow at all.
    paths: ["rust/**", "scripts/**", "docs/tools/**", "comm/**", "agents/**", ".github/workflows/rust.yml"]
  workflow_dispatch: {}

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  window-minimized-windows:
    name: native minimized window (Windows)
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: rust
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prove native minimized workload and progress
        run: cargo test -p sot-frontend --test window_minimized --features test-window-progress --locked

  window-minimized-macos:
    name: native minimized window (macOS)
    runs-on: macos-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: rust
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prove native minimized workload and progress
        run: cargo test -p sot-frontend --test window_minimized --features test-window-progress --locked

  window-close-windows:
    name: native window close (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prove native window close and the teardown backstop
        run: cargo test -p sot-frontend --test window_close --features test-window-close --locked

  window-close-macos:
    name: native window close (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Prove native window close and the teardown backstop
        run: cargo test -p sot-frontend --test window_close --features test-window-close --locked

  test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: "${{ !startsWith(github.event.head_commit.message, 'release: v') }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The MathJax helper's tests render through the real node script, which needs its npm modules.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rust/backend/sidecars/mathjax/package-lock.json
      - name: Install the MathJax helper's modules
        working-directory: rust/backend/sidecars/mathjax
        run: npm ci
      - name: Build workspace
        run: cargo build --workspace --locked
      # Functions over 100 code lines fail unless they carry an allow with a reason. The vendored vt100
      # crate is excluded: it denies clippy::all in its own source, which beats -A on the command line.
      - name: Function length
        run: cargo clippy --workspace --exclude vt100-ctt --all-targets --locked -- -A clippy::all -D clippy::too_many_lines
      # rust/clippy.toml holds the rules this step enforces, one labelled group each, every group opening with its
      # rule; a sanctioned site carries #[allow(clippy::disallowed_methods, reason = "...")] on its one statement. A path
      # that does not exist on a leg draws a warning there.
      - name: Disallowed methods
        run: cargo clippy --workspace --exclude vt100-ctt --lib --bins --locked -- -A clippy::all -D clippy::disallowed_methods
      - name: Function length allowances can only fall
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          n=$(git grep -c 'clippy::too_many_lines' -- rust ':!rust/vt100' | awk -F: '{ s += $2 } END { print s + 0 }')
          echo "allowances: $n (pinned: 65)"
          [ "$n" -eq 65 ] || { echo "the count changed: lower 65 here when you remove an allowance"; exit 1; }
      # --nocapture: the fault sweeps REPORT (never assert) their torn-tail
      # hit counts on stderr — captured output would hide them from CI logs,
      # making the sweeps' actual coverage invisible (review finding).
      # --no-fail-fast: one failing test binary must not hide the others.
      - name: Build selected-body fixture
        shell: bash
        run: |
          mkdir -p ../dev/output
          cargo test -p sot-log --test test_body_fixture --locked --no-run --message-format=json > ../dev/output/iso-sh-ci-artifacts.json
          python3 - <<'PYFIXTURE'
          import json, os
          rows = [json.loads(line) for line in open('../dev/output/iso-sh-ci-artifacts.json') if line.startswith('{')]
          paths = [row['executable'] for row in rows if row.get('target', {}).get('name') == 'test_body_fixture' and row.get('executable')]
          if len(paths) != 1:
              raise SystemExit('expected exactly one compiled selected-body fixture')
          path = os.path.abspath(paths[0]).replace('\\', '/')
          with open('../dev/output/iso-sh-ci-path', 'w') as output:
              output.write(path + '\n')
          PYFIXTURE
      - name: Test selected Rust bodies
        shell: bash
        run: |
          python3 - <<'PYCARGO'
          import json, os, pathlib, subprocess
          manifest = pathlib.Path('Cargo.toml').resolve()
          root = pathlib.Path('../dev/output/iso-sh-ci-cargo').resolve()
          root.mkdir()
          environment = {k: v for k, v in os.environ.items() if not k.startswith('SOT_')}
          runner = root / 'runner.py'
          runner.write_text('import os, subprocess, sys\nos.chdir(sys.argv[1])\nsys.exit(subprocess.run(sys.argv[2:]).returncode)\n')
          environment.setdefault('CARGO_HOME', str(pathlib.Path.home() / '.cargo'))
          environment.setdefault('RUSTUP_HOME', str(pathlib.Path.home() / '.rustup'))
          home = root / 'home'
          home.mkdir()
          for name in ('HOME', 'USERPROFILE', 'CODEX_HOME', 'CLAUDE_CONFIG_DIR', 'XDG_CONFIG_HOME', 'XDG_STATE_HOME'):
              environment[name] = str(home)
          for key, name, flags in [('normal', 'ordinary', ['--exact']), ('ignored', 'qualified::ignored_positive', ['--ignored', '--exact']), ('absent', 'absent', ['--exact']), ('substring', 'near', [])]:
              directory = root / key
              directory.mkdir()
              (directory / 'iso-sh-fixture-request').touch()
              (directory / 'go').touch()
              with (directory / 'cargo.log').open('w') as output:
                  subprocess.run(['cargo', 'test', '--config', 'target."cfg(all())".runner=' + json.dumps(['python3', str(runner), str(directory)]), '--manifest-path', str(manifest), '-p', 'sot-log', '--test', 'test_body_fixture', '--locked', name, '--'] + flags + ['--format', 'pretty', '--color', 'never', '--show-output', '--test-threads=1'], cwd=directory, env=environment, stdout=output, stderr=subprocess.STDOUT, timeout=120, check=True)
          PYCARGO
          proof_mode=--portable
          if [ '${{ matrix.os }}' = ubuntu-latest ]; then proof_mode=--all; fi
          ISO_SH_CARGO_PROOFS="$(python3 -c "import pathlib; print(pathlib.Path('../dev/output/iso-sh-ci-cargo').resolve())")" bash ../scripts/tests/test-test-body.sh "$proof_mode" "$(cat ../dev/output/iso-sh-ci-path)"

      - name: Folder trust premises (Windows and macOS)
        if: matrix.os != 'ubuntu-latest'
        run: |
          cargo test -p sot-backend --bin sotd trust_declaration --locked -- --nocapture
          cargo test -p sot-backend --bin sotd agents::folder_trust --locked -- --nocapture
          cargo test -p sot-backend --test trust_declare --test trust_premises --locked -- --nocapture
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture

      # (The dedicated lane_bridge step was deleted 2026-09-18: "Test
      # workspace" above runs that suite byte-identically, so the step was
      # an 8-minute second run bought for a per-suite budget the job-level
      # timeout now provides.)
      # The PowerShell scripts are executed by nothing in CI, and no dev box in
      # the Linux fleet has pwsh — so before this step, a ps1 syntax error
      # shipped to main was first discovered by the next FE LAUNCH (launchers
      # self-update from main on every start, unpinned). Parse them where a
      # PowerShell host already exists: this Windows leg.
      #
      # `shell: powershell` (Windows PowerShell 5.1), NOT `pwsh` (7): this gate
      # used to run under pwsh and could not catch the bug class it exists for.
      # 5.1 decodes a BOM-less .ps1 as cp1252; pwsh 7 decodes it as UTF-8. A
      # UTF-8 non-ASCII char inside a STRING LITERAL therefore mojibakes into a
      # phantom double-quote under 5.1 and fails the whole file to parse, while
      # pwsh reports it clean. 5.1 is what the .lnk launcher actually runs, so
      # it is what must vet these files. (See the AUTHORING GOTCHA at the top
      # of launch-sot.ps1.)
      - name: Parse PowerShell scripts
        if: matrix.os == 'windows-latest'
        shell: powershell
        working-directory: scripts
        run: |
          $failed = $false
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE ERRORS: $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
      # Behavioural cover for the Windows update applier. Parsing proves the
      # file loads; this proves it actually applies, verifies digests, rolls
      # back, and refuses a foreign-target pointer. Same 5.1 host as above.
      - name: Test sot-apply.ps1
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: .\scripts\tests\test-sot-apply.ps1
        working-directory: .

      # docs/adr/0030-versioning-release-and-auto-update.md's 2026-09-17
      # amendment: the one pinned-checkout predicate that replaced four
      # disagreeing dev-vs-release heuristics, plus the shortcut-target
      # rule that reads it. Real git state (a temp repo, a branch clone, a
      # detached worktree), no fake, same 5.1 host as the steps above.
      - name: Test install layout (pinned-checkout predicate)
        if: matrix.os == 'windows-latest'
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-install-layout.ps1
        working-directory: .

      # ADR 0042 L1c: the launcher's local-daemon start/stop (sot-local-
      # daemon.ps1), driven against the sotd.exe this same job's "Build
      # workspace" step already built (target\debug, since that step has no
      # --release) -- see the test's own header for why a debug build is
      # sufficient. Same 5.1 host as the two steps above. Bounded: every
      # wait inside the test is itself bounded, but a real spawned sotd.exe
      # that never comes up (or never goes down) must not hang the job.
      - name: Test local daemon launcher
        if: matrix.os == 'windows-latest'
        shell: powershell
        timeout-minutes: 10
        run: .\scripts\tests\test-local-daemon.ps1
        working-directory: .

      - name: Test launcher leases
        if: matrix.os == 'windows-latest'
        shell: powershell
        timeout-minutes: 10
        run: .\scripts\tests\test-launcher-leases.ps1
        working-directory: .

      # scripts/sot-hosts.ps1's Get-SotTopologyPlan against a fake sotd that prints fixed plan lines -- pure text
      # processing, no ssh, no network, so this needs neither a built sotd.exe nor CI's $env:CI-gated real-daemon
      # sections. Same 5.1 host as the steps above.
      - name: Test topology plan
        if: matrix.os == 'windows-latest'
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-topology-plan.ps1
        working-directory: .

      - name: Parse shell scripts
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: |
          shopt -s globstar nullglob
          rc=0; n=0
          for f in scripts/**/*.sh docs/tools/*.sh; do
            n=$((n + 1))
            if bash -n "$f"; then echo "ok: $f"; else echo "PARSE ERROR: $f"; rc=1; fi
          done
          [ "$n" -gt 0 ] || { echo "no shell scripts found"; rc=1; }
          exit "$rc"

      - name: Check the layout
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: bash scripts/tests/check-layout.sh --allow scripts/tests/check-layout.allow

      - name: Test the layout tools
        if: matrix.os == 'ubuntu-latest'
        working-directory: .
        run: bash scripts/tests/test-check-layout.sh && bash scripts/tests/test-moved-check.sh

      # The bash sibling of the PowerShell topology plan test above: scripts/lib/sot-hosts.sh's sot_topology_plan
      # against the same fake sotd, pure text processing, hermetic and fast.
      - name: Test topology plan (bash)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: bash scripts/tests/test-topology-plan.sh
        working-directory: .

      # The installer's pure decisions and the sot-launch socket probe, run
      # from install.sh's own text; hermetic and fast.
      - name: Test installer state (bash)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: bash scripts/tests/installer-state.sh
        working-directory: .

      - name: Test installer apply (bash)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: bash scripts/tests/installer-apply.sh
        working-directory: .

      # PR #148 Codex review F10: hermetic + fast, so it rides along in this
      # existing ubuntu leg rather than a dedicated job.
      # The context deadline covers foreground children and the final wait.
      # Fixtures are finite, isolated, and require entry and completion evidence.
      - name: Test heartbeat context deadline (hermetic)
        shell: bash
        timeout-minutes: 5
        working-directory: .
        run: bash comm/tests/test-heartbeat-ctx-wait.sh

      - name: Test sot-comm disambiguation (hermetic)
        if: matrix.os == 'ubuntu-latest'
        working-directory: comm/tests
        run: |
          bash test-join-disambiguation.sh
          # C10 (isolation-plan.md §3): the one gate every endpoint value
          # leaves comm-lib.sh through, plus the ssh: resolvers and the
          # sot_ssh_bridge wire round trip -- a suite that runs nowhere is
          # not a test.
          bash test-endpoint-gate.sh
          # The verdict table: every receipt/ack/exit-status/stderr
          # combination through the one place a send's verdict is decided,
          # asserting the rule PROTOCOL.md now states -- a send with a
          # receipt reports delivered, whatever the transport's exit status
          # or stderr say. Three rounds of fixes each closed the instances
          # they were handed and left another behind, because the verdict was
          # read from the transport; 22 of its 38 rows disagreed with the
          # rule before this stage. A table that runs only when somebody
          # remembers cannot hold that closed. 28 seconds, hermetic.
          bash test-relay-file-first.sh
          # 0031 B1: every inbox append is taken under the kernel's file
          # lock, and one that cannot be made is FAILED, never `filed` -- the
          # two writers, a killed holder, a frozen one, the no-flock route and
          # the one wait constant.
          bash test-hub-files.sh
          # The registry's one writer never publishes an empty, unparseable or
          # two-document file, and its one reader says unreadable, never absent.
          bash test-registry-io.sh
          # The read cursor is a line count with the hash of the last line
          # read, so a cut-back steps back one line and nothing is shown twice.
          bash test-comm-poll-cursor.sh
          # Suite bootstrap policy and executed shared-await controls.
          bash test-rm-guard.sh
          # Staging publishes each file whole by a sibling rename, copying no source permissions.
          bash test-stage-bin.sh
          # 0031 B1's caller: a registry miss goes to the wire and one lap ends
          # in one verdict; the acceptance matrix's classifier keys on that
          # verdict.
          bash test-send-routes-to-relay.sh
          bash test-comm-matrix-verdict.sh
          bash test-status-floor.sh
          # ADR 0049, User isolation: every writer makes the comm folder 0700/0600 under umask 022,
          # a folder an older release left is tightened at join, user files keep the caller's umask.
          bash test-comm-private.sh
          # A session may declare its handle only into the row its own
          # identity names. Until this suite ran here, the one thing that
          # proves it was a suite nobody ran but by hand -- and the defect it
          # now covers let every hermetic run rewrite the handle of whichever
          # live row happened to be running the tests.
          bash test-agent-join.sh
          # The carriage-return suite for jq. A native jq on Windows rewrites every
          # \n to \r\n and command substitution keeps the \r on the value;
          # until this ran here, the only thing standing between that and a
          # false "no such handle" was a human remembering to run it. Its
          # sibling for a token GitHub rejects runs in the agents step below.
          # Hermetic, under a second.
          bash test-crlf-jq-output.sh
          # A missing jq, flock or perl is named to the session by poll, session
          # start and the Stop hook, never passed silently.
          bash test-comm-deps.sh
          # B1b: the registry lock names its holder, a holder proved dead on
          # this machine is reclaimed through one marker, and any other is
          # named in the FAILED line; the race, the mixed rollout, the touch
          # bound and the clear command.
          bash test-registry-lock.sh
          # A second agent started inside a session (codex exec, claude -p) never acts as the row's handle.
          bash test-agent-layers.sh

      - name: Test agents CLIs (hermetic)
        if: matrix.os == 'ubuntu-latest'
        working-directory: agents/tests
        run: |
          # A spawn onto another box writes no row here, so a folder that lists
          # a handle is one whose own box can file for it.
          bash test-spawn-remote-no-local-row.sh
          bash test-spawn-capsule-workspace.sh
          bash test-despawn-resolve.sh
          bash test-sot-fe-version.sh
          # reauth moves only the row it runs in; a second argument or a missing row id sends nothing.
          bash test-sot-fe-reauth.sh
          # ccx's default handle is built from the comm library's safe pieces; a failed derivation stops the launch.
          bash test-ccx-launch.sh
          # The carriage-return rule for the token: a \r kept on it is a token
          # GitHub rejects. Hermetic, under a second.
          bash test-crlf-gh-auth.sh

  # ADR 0041 step-4 spec gate, "CI reality": `windows-latest` (26100+) has a
  # `ClosePseudoConsole` that returns immediately — it cannot exercise the
  # pre-24H2 blocking close the ConPTY drain ordering (`Pseudoconsole::close_pty`
  # in capsule/producer/conpty/mod.rs) is pinned against. `windows-2022` is the older image that
  # still blocks there. Deliberately its own tiny job rather than added to
  # the main matrix above: it exists ONLY to catch that one behavioral gap,
  # not to duplicate the full workspace build+test on a second Windows image.
  #
  # `tests/capsule_win.rs` (the capsule runtime, step 4 unit 2) joined this
  # job rather than getting a third one: its teardown ALSO calls
  # `close_pty()` and depends on the exact same blocking-close/concurrent-
  # drain ordering, so `windows-latest` alone could pass it there too
  # without ever exercising the hang risk this job exists to catch.
  #
  # ADR 0041 step 6, unit U0 round-1: `pipe_win` and `e2e_pipe` joined this
  # job too — the same-connection challenge's security-sensitive Windows
  # tests (real named pipes, a real cross-process server) belong in a named,
  # budgeted job, not folded anonymously into the general `windows-latest`
  # matrix's blanket `cargo test --workspace`. This is the FULL adoption of
  # the ADR's pinned five-command table (conpty/capsule_win/pipe_win/
  # e2e_pipe/supervisor, ~75 min total incl. checkout+build), each at
  # its own ADR-pinned per-step cap, PLUS step 6 U3's own `fe_client`
  # addition below (~95 min total incl. checkout+build); the job-level
  # timeout leaves headroom for checkout+build plus every step's worst
  # case. `pipe_win`/`e2e_pipe` ALSO still run via the main `test` job's
  # blanket `cargo test --workspace` on `windows-latest` — the duplication
  # is deliberate, not yet worth a special-case exclusion.
  #
  # ADR 0041 step 6, unit U2 (L1-unix LU3c: `supervisor_win.rs` renamed
  # `supervisor/` and ungated to run on Linux too): `supervisor` spawns
  # the real `sot-capsule` binary and drives it as a real client (the
  # supervisor lane, a real cross-process authority) — belongs here for
  # the identical "real named pipes, a real cross-process server" reason
  # `pipe_win`/`e2e_pipe` do, at the ADR's own pinned 15-minute cap.
  #
  # ADR 0041 step 6, unit U3 (L1-unix LU3c: `fe_client_win.rs` renamed
  # `fe_client/`, same ungating): `fe_client` drives the FE attach-only
  # client against a real supervisor + real capsule the identical way —
  # belongs here for the same reason, budgeted separately (20 min) since
  # its reconnect case spawns a SECOND real supervisor process.
  conpty-windows-2022:
    name: conpty + capsule owned-ConPTY + pipe/challenge/supervisor/fe-client tests (windows-2022)
    runs-on: windows-2022
    if: "${{ !startsWith(github.event.head_commit.message, 'release: v') }}"
    # See the per-step caps below for what each command budgets; this is
    # checkout+build (~15 min per the ADR) plus all six steps' worst case.
    timeout-minutes: 95
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Built FIRST: the real-process suites below leave supervisors
      # behind that outlive their step (the runner reaps them at job end)
      # and a live sot-capsule.exe pins the file -- a rebuild after them
      # fails with 'Access is denied' as soon as the suites run fast enough.
      # ADR 0042 slice L1a: `sot-capsule` lives in the sot-log package, a
      # DIFFERENT crate than `sotd` (sot-backend) — `cargo test -p
      # sot-backend` builds `sotd.exe` itself (CARGO_BIN_EXE_sotd, same
      # package as the test) but has no reason to build a binary from a
      # dependency crate, so it's built explicitly here, into the SAME
      # target dir `sotd.exe` lands in — exactly the sibling-executable
      # layout the daemon's own `rows::spawn::detach::sot_capsule_exe()`
      # (current_exe().parent()) assumes in production.
      - name: Build sot-capsule (for the backend capsule-workspace test below)
        timeout-minutes: 5
        run: cargo build -p sot-log --bin sot-capsule
      # --test conpty: the one test BINARY (tests/conpty.rs), not a name
      # substring filter — nothing else in the workspace needs this image.
      # --nocapture: test 4's DA1-presence finding and the jobbed-probe
      # logged in test 1 are deliberately only logged (see conpty.rs), never
      # asserted; captured output would hide them from CI, the same
      # reasoning the fault sweeps above already establish for this
      # workspace.
      #
      # A close-ordering bug here is exactly a HANG (pre-24H2's
      # ClosePseudoConsole blocking forever with nothing draining hOutput) —
      # bounded so that failure mode fails the job in minutes, not by
      # waiting out the platform-wide default.
      - name: Test conpty (owned ConPTY + job containment)
        timeout-minutes: 5
        run: cargo test -p sot-log --test conpty -- --nocapture
      # --test capsule: same reasoning, one test BINARY (tests/capsule/,
      # L1-unix LU2a: renamed from tests/capsule_win.rs when the writer
      # loop became generic over `Producer`) — the DSR-presence finding in
      # the e2e test is likewise logged, not asserted
      # (host/build-version-dependent).
      - name: Test capsule (capsule runtime, ConPTY producer)
        timeout-minutes: 10
        run: cargo test -p sot-log --test capsule -- --nocapture
      # --test pipe_win: the named-pipe transport plus the same-connection
      # challenge's real-pipe and real-cross-process tests (ADR 0041 U0
      # round-1).
      - name: Test pipe_win (named-pipe transport + same-connection challenge)
        timeout-minutes: 10
        run: cargo test -p sot-log --test pipe_win -- --nocapture
      # --test e2e_pipe: the full real-pipe attach/mgmt end-to-end.
      - name: Test e2e_pipe (real-pipe end-to-end)
        timeout-minutes: 10
        run: cargo test -p sot-log --test e2e_pipe -- --nocapture
      # --test supervisor: the real-process supervisor authority --
      # spawn/adopt, the anti-flap bound, end_run's record_closed then
      # record_verified, and the version-skew refusal, all against a real
      # `sot-capsule supervise` child. L1-unix LU3c: renamed from
      # `tests/supervisor_win.rs` when the suite ungated to run on Linux
      # too (over a real socket lane, a real `/bin/sh` producer) -- this
      # job proves Windows behavior is unchanged; the ubuntu matrix job's
      # blanket `cargo test --workspace` picks the Linux half up on its
      # own.
      - name: Test supervisor (the supervisor authority, real process)
        timeout-minutes: 15
        run: cargo test -p sot-log --test supervisor -- --nocapture
      # --test fe_client: ADR 0041 step 6 U3, the FE attach-only
      # client -- attach as a watcher and receive the checkpoint;
      # take-on-first-input's resize-before-flush ordering (proven via
      # the sealed voyage record); end_run from the quit dispatcher
      # reaching record_closed; and reconnect after the capsule is
      # killed and a fresh supervisor takes over restoring the screen
      # from the new checkpoint -- the last of which spawns a SECOND
      # real supervisor process and rides the client's own real
      # 250ms-to-4s backoff, hence the generous budget. L1-unix LU3c:
      # renamed from `tests/fe_client_win.rs`, same reason as
      # `supervisor` above.
      - name: Test fe_client (FE attach-only client, real process)
        timeout-minutes: 20
        run: cargo test -p sot-log --test fe_client -- --nocapture
      # --test capsule_workspaces: ADR 0042 slice L1a, the daemon's capsule
      # workspace runtime -- a real `sotd` spawning a real, DETACHED
      # `sot-capsule supervise` for workspace.create, workspace.list
      # reaching phase "ready", pty.open's attach_direct refusal, adoption
      # by a fresh `sotd` after the first one is killed (the supervisor
      # must have survived), and workspace.destroy ending the run without
      # deleting the state directory.
      - name: Test capsule_workspaces (daemon capsule workspace runtime, real process)
        timeout-minutes: 15
        run: cargo test -p sot-backend --test capsule_workspaces -- --nocapture

  # The Windows containment tests that need julia, Git for Windows' bash or a job around the test process are `#[ignore]`
  # in `cargo test` (rust/backend/src/lifecycle/contain.rs); this job runs them, with julia installed, on every run.
  windows-ignored-containment:
    name: containment, ignored tests (windows-latest)
    runs-on: windows-latest
    if: "${{ !startsWith(github.event.head_commit.message, 'release: v') }}"
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Test the ignored containment tests
        run: cargo test -p sot-backend --bins contain -- --include-ignored --test-threads=1

  p2-e2e:
    name: P2 e2e (real helper, offline)
    runs-on: ubuntu-latest
    if: "${{ !startsWith(github.event.head_commit.message, 'release: v') }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rust/log/claude-sdk-helper/package-lock.json
      - name: Install helper deps
        working-directory: rust/log/claude-sdk-helper
        run: npm ci
      - name: Test helper
        working-directory: rust/log/claude-sdk-helper
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run P2 e2e test
        working-directory: rust
        env:
          SOT_HELPER_E2E: "1"
        run: cargo test -p sot-log --test claude_e2e -- --nocapture

  # Nothing else in CI ever runs scripts/install.sh -- the release smoke only
  # boots a prebuilt artifact and checks --version. This job pins
  # SOT_INSTALL_TAG so the CHECKOUT's own install.sh body runs (skipping the
  # fetch-and-reexec prelude) against the newest PUBLISHED release's
  # artifacts -- a `--be-only` fresh install into a clean container (no
  # tmux, no gh), the case only a brand-new user would hit. The prelude
  # itself has no CI coverage.
  fresh-install-smoke:
    name: fresh install smoke (clean container)
    runs-on: ubuntu-latest
    if: "${{ !startsWith(github.event.head_commit.message, 'release: v') }}"
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install minimal deps (no tmux, no gh)
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q git curl tar jq ca-certificates
      - name: Find latest published release tag
        id: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resp="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/releases")"
          tag="$(printf '%s' "$resp" | jq -r '.[0].tag_name // empty')"
          if [ -z "$tag" ]; then
            echo "no releases found for ${{ github.repository }} (fork with no releases?) -- skipping" >&2
          fi
          if [ -n "$tag" ] && ! curl -fsS -o /dev/null -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/contents/scripts/lib/sot-daemon.sh?ref=$tag"; then
            echo "newest published release $tag predates scripts/lib/sot-daemon.sh: the smoke resumes once a release carries it" >&2
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Fresh --be-only install into a clean $HOME
        if: steps.latest.outputs.tag != ''
        run: |
          tag="${{ steps.latest.outputs.tag }}"
          export HOME="$RUNNER_TEMP/sot-fresh-home"
          mkdir -p "$HOME"
          out="$(SOT_INSTALL_TAG="$tag" bash "$GITHUB_WORKSPACE/scripts/install.sh" --be-only --no-service --version "$tag" 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qi 'tmux' && { echo "installer output mentions tmux on a --be-only install"; exit 1; }
          got="$("$HOME/.local/share/sot/bin/sotd" --version)"
          echo "sotd --version: $got (expected: $tag)"
          case "$got" in *"${tag#v}"*) ;; *) echo "version mismatch"; exit 1 ;; esac
          [ -f "$HOME/.sot-comm/bin/comm-lib.sh" ] || { echo "comm-lib.sh missing"; exit 1; }
          find "$HOME/.config" -name sot-tmux.service | grep -q . && { echo "sot-tmux.service present"; exit 1; }
          exit 0
      # A shared-home cluster sees every host's sotd.service FILE in the same
      # ~/.config/systemd/user; the old guard read a mere `cat` of it as
      # "another host owns this" and refused. This stubs one that is never
      # active here -- proving that case now installs (installer_running_daemon_bin).
      - name: Second --be-only install into a different prefix (shared-home unit case)
        if: steps.latest.outputs.tag != ''
        run: |
          tag="${{ steps.latest.outputs.tag }}"
          export HOME="$RUNNER_TEMP/sot-fresh-home"
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/systemctl" <<'STUB'
          #!/bin/sh
          case "$*" in
            *"is-active --quiet sotd.service"*) exit 3 ;;
            *"cat sotd.service"*) echo 'ExecStart=/home/another-host/.local/share/sot/bin/sotd --project-root /home/another-host --label sot' ;;
            *) exit 0 ;;
          esac
          STUB
          chmod +x "$RUNNER_TEMP/fakebin/systemctl"
          out="$(PATH="$RUNNER_TEMP/fakebin:$PATH" SOT_INSTALL_TAG="$tag" bash "$GITHUB_WORKSPACE/scripts/install.sh" --be-only --no-service --version "$tag" --prefix "$HOME/.local/share/sot2" 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          [ -x "$HOME/.local/share/sot2/bin/sotd" ] || { echo "second prefix missing sotd"; exit 1; }
