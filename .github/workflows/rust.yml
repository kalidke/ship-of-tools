# Rust CI (ADR 0030 §3): build + test on the blocking platforms, at each landing.
#
# Runs on pushes to main and on demand -- NOT on pull requests (decided 2026-09-08: waiting on hosted CI per PR was the
# workflow's slowest step and burned the Actions allowance; a change merges on its local suites, the windows-gnu
# cross-check and its review round). The per-landing run is held to five to seven minutes wall: the build, the unit
# tests and the integration tests that finish in seconds, sharded on all three systems by .github/test-shards.txt, and
# every job carries a `timeout-minutes` at its bound so a slow one fails, named, instead of stretching the wall.
# Everything that sleeps on the clock, needs a prepared Julia depot, drives a native window, or cannot fit a shard runs
# once per release in release-gate.yml (dispatched by hand at the release gate, never on a tag: scripts/CLAUDE.md,
# "Release path"). Windows-only frontend code that cannot be cross-compiled on the backend runs this workflow on its
# branch by hand: `gh workflow run rust.yml --ref <branch>`.
#
# Deliberately NO `cargo fmt --check` / `clippy -D warnings` yet — the
# workspace predates the gate and isn't fmt/clippy-clean; normalizing it is a
# fleet-coordinated one-time pass (would conflict with in-flight branches).
# Add both steps here when that lands.
# The one clippy gate is function length (the step below).
#
# macOS IS in this matrix (added after v0.5.9's release build failed on it).
# The old rationale for leaving it out — "a private repo burns 10x Actions
# minutes" — died at the public flip: public repos get free GitHub-hosted
# runners, macOS included. And it was never actually non-blocking: release.yml
# lists macos-aarch64 with experimental:false, so a macOS failure SKIPS the
# publish job and kills the whole release. Testing it only at tag time meant
# the tag was the first place anyone learned it was broken, with no way to
# fix it in place. Pre-merge is where that belongs.
# Hosted runners run 20 jobs at once, 5 of them macOS: this workflow starts 18, 5 on macOS.

name: Rust

on:
  push:
    branches: [main]
    # scripts/** is here because this workflow carries the launcher parse steps:
    # without it, a script-only PR — exactly the class that needs parsing — never
    # triggers them. Proven by PR #82 (a ps1-only hotfix) running zero Rust checks.
    # comm/** added alongside the "Test sot-comm disambiguation" step below
    # (PR #148 Codex review F10) — without it, a comm-only change (like the
    # one that added that step) would never trigger this workflow at all.
    paths: ["rust/**", "scripts/**", "docs/tools/**", "comm/**", "agents/**", ".github/workflows/rust.yml", ".github/actions/**", ".github/test-shards.txt", ".github/wgl-depot.sh"]
  workflow_dispatch: {}

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: plan the test shards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      landing: ${{ steps.plan.outputs.landing }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: echo "landing=$(python3 scripts/tests/shards.py plan landing)" >> "$GITHUB_OUTPUT"

  test:
    name: build+test (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # The bound of the shard: about 1 min of setup, 2 of cached build, up to 5 of tests. A slow shard fails here, named.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.landing) }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # MSVC links the full debug information of every test executable; line tables keep the backtraces and cost far less.
      - name: Line tables only (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: ${{ matrix.os == 'ubuntu-latest' && 'test-linux' || format('test-{0}', matrix.os) }}
          cache-on-failure: true
          save-if: ${{ contains(matrix.shard, 'rest-0') }}
      # The sotd unit tests render through the real MathJax node script, which needs its npm modules.
      - uses: actions/setup-node@v7
        if: contains(matrix.shard, 'sotd') || matrix.shard == 'gate-wgl'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rust/backend/sidecars/mathjax/package-lock.json
      - name: Install the MathJax helper's modules
        if: contains(matrix.shard, 'sotd') || matrix.shard == 'gate-wgl'
        working-directory: rust/backend/sidecars/mathjax
        run: npm ci
      # The tests that start Julia (the sidecar tests in sotd, the daemon suites in wake and rest that send kernel, preview or
      # REPL ops) run the 1.13 every system has.
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      # sotd and sot-capsule sit in the target dir the backend tests spawn them from.
      - name: Build workspace
        run: cargo build --workspace --locked
      # macOS runs, in the sup shard, the clippy gate and the portable selected-body proofs that `checks` runs on Linux:
      # cfg(macos) code is checked only where it compiles. Windows runs them, and both systems the disallowed-methods
      # gate, in release-gate.yml: Linux's run of that gate stays at each landing.
      # The vendored vt100 crate is excluded: it denies clippy::all in its own source, which beats -A on the command
      # line. CLIPPY_CONF_DIR names rust/clippy-tests: a test runs its children through sot_log::test_wait (docs/ownership.md).
      - name: Test children
        if: matrix.os == 'macos-latest' && contains(matrix.shard, 'sup')
        env:
          CLIPPY_CONF_DIR: "${{ github.workspace }}/rust/clippy-tests"
        run: cargo clippy --workspace --exclude vt100-ctt --all-targets --features sot-frontend/test-pane-timing,sot-frontend/test-window-close --locked -- -A clippy::all -D clippy::disallowed_methods
      - name: Selected Rust bodies (portable proofs)
        if: matrix.os == 'macos-latest' && contains(matrix.shard, 'sup')
        uses: ./.github/actions/selected-body
        with:
          proofs: --portable

      # The rest shards link every test executable they run; that is build, not test, so it is outside the bound.
      - name: Build the test executables
        shell: bash
        if: contains(matrix.shard, 'rest')
        run: python3 ../scripts/tests/shards.py build ${{ matrix.shard }}
      # --nocapture: tests that report on stdout (the fault sweeps' hit counts, the PASS lines other lanes read) print
      # here. --no-fail-fast: one failing test binary must not hide the others.
      - name: Test shard ${{ matrix.shard }}
        shell: bash
        timeout-minutes: 5
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: python3 ${{ github.workspace }}/scripts/tests/test-binary-bound.py 900
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: python3 ${{ github.workspace }}/scripts/tests/test-binary-bound.py 900
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: python3 ${{ github.workspace }}/scripts/tests/test-binary-bound.py 900
        run: python3 ../scripts/tests/shards.py run ${{ matrix.shard }}
      # Every test of a named target runs in exactly one shard of .github/test-shards.txt; a test unassigned or assigned twice
      # fails the run here, named.
      - name: Check that every test runs in exactly one shard
        if: contains(matrix.shard, 'rest-0')
        shell: bash
        timeout-minutes: 3
        run: python3 ../scripts/tests/shards.py check

  # The PowerShell scripts' suites, each in a scratch profile of its own (scripts/tests/scratch-guard.ps1); the launcher's
  # (the local daemon, the leases) and the heartbeat suite run in release-gate.yml.
  scripts-windows:
    name: PowerShell scripts (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The install layout suite runs the real sotd.exe (its offline declaration cases).
      - name: Build the daemon
        working-directory: rust
        run: cargo build -p sot-backend --bin sotd --locked
      # The PowerShell scripts are executed by nothing in CI, and no dev box in
      # the Linux fleet has pwsh — so before this step, a ps1 syntax error
      # shipped to main was first discovered by the next FE LAUNCH (launchers
      # self-update from main on every start, unpinned). Parse them where a
      # PowerShell host already exists: this Windows leg.
      #
      # `shell: powershell` (Windows PowerShell 5.1), NOT `pwsh` (7): this gate
      # used to run under pwsh and could not catch the bug class it exists for.
      # 5.1 decodes a BOM-less .ps1 as cp1252; pwsh 7 decodes it as UTF-8. A
      # UTF-8 non-ASCII char inside a STRING LITERAL therefore mojibakes into a
      # phantom double-quote under 5.1 and fails the whole file to parse, while
      # pwsh reports it clean. 5.1 is what the .lnk launcher actually runs, so
      # it is what must vet these files. (See the AUTHORING GOTCHA at the top
      # of launch-sot.ps1.)
      - name: Parse PowerShell scripts
        shell: powershell
        working-directory: scripts
        run: |
          $failed = $false
          Get-ChildItem -Path '*.ps1', 'tests/in-job.ps1', 'tests/install-smoke.ps1', 'tests/scratch-guard.ps1', 'tests/test-scratch-guard.ps1' | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE ERRORS: $($_.Name)"
              $errs | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
      # Each Windows suite below runs in a scratch profile of its own, made and removed by scripts/tests/scratch-guard.ps1
      # (a home under the account's real temp folder, a child PowerShell there). This step tests that guard: its rule, and
      # the whole entry on a probe suite.
      - name: Test scratch guard
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-scratch-guard.ps1
        working-directory: .

      # Behavioural cover for the Windows update applier. Parsing proves the
      # file loads; this proves it actually applies, verifies digests, rolls
      # back, and refuses a foreign-target pointer. Same 5.1 host as above.
      - name: Test sot-apply.ps1
        shell: powershell
        run: .\scripts\tests\test-sot-apply.ps1
        working-directory: .

      # install-manifest.ps1 drops the pointer armed over the install it replaces, and keeps it across a same-version
      # rewrite. A stand-in sot.exe built with the runner's csc.exe, a scratch git repo, no network.
      - name: Test install-manifest.ps1
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-install-manifest.ps1
        working-directory: .

      # docs/history/adr/0030-versioning-release-and-auto-update.md's 2026-09-17
      # amendment: the one pinned-checkout predicate that replaced four
      # disagreeing dev-vs-release heuristics, plus the shortcut-target
      # rule that reads it. Real git state (a temp repo, a branch clone, a
      # detached worktree), no fake, same 5.1 host as the steps above.
      - name: Test install layout (pinned-checkout predicate)
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-install-layout.ps1
        working-directory: .

      # The PowerShell scripts' network bounds: Invoke-SotWithin (sot-hosts.ps1), the bound every script ssh call
      # runs under, and each script call a test can reach with a stand-in.
      - name: Test Invoke-SotWithin
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-sot-within.ps1
        working-directory: .

      # A script under 'Stop' must not depend on how its caller redirects: Invoke-SotNative, pack-build.ps1 and
      # relaunch-sot.ps1 against a stand-in cargo that warns on stderr.
      - name: Test native stderr under Stop
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-native-stderr.ps1
        working-directory: .

      # scripts/sot-hosts.ps1's Get-SotTopologyPlan against a fake sotd that prints fixed plan lines -- pure text
      # processing, no ssh, no network, so this needs neither a built sotd.exe nor CI's $env:CI-gated real-daemon
      # sections. Same 5.1 host as the steps above.
      - name: Test topology plan
        shell: powershell
        timeout-minutes: 5
        run: .\scripts\tests\test-topology-plan.ps1
        working-directory: .

  # The ubuntu checks at each landing: the clippy gates, the selected-body proofs (all of them on this leg), the gate scripts'
  # own tests and the installer suites. The slow ones (storage exhaustion, the gate's clippy and bash 3.2 jobs, the comm and
  # agents suites) run in release-gate.yml. The shell steps set their own working directory.
  checks-linux:
    name: checks (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The vendored vt100 crate is excluded: it denies clippy::all in its own source, which beats -A on the command
      # line. CLIPPY_CONF_DIR names rust/clippy-tests: a test runs its children through sot_log::test_wait (docs/ownership.md).
      - name: Test children
        env:
          CLIPPY_CONF_DIR: "${{ github.workspace }}/rust/clippy-tests"
        run: cargo clippy --workspace --exclude vt100-ctt --all-targets --features sot-frontend/test-pane-timing,sot-frontend/test-window-close,sot-backend/daemon-lifetime-faults --locked -- -A clippy::all -D clippy::disallowed_methods
      - name: Test native harness helpers
        shell: bash
        run: |
          bash ../scripts/tests/run-filtered-tests.sh 8 ../dev/output/native-harness-helpers.log -- cargo test -p sot-frontend --bin sot --features test-pane-timing,test-window-close --locked ui::app::tests::harness_tests:: -- --test-threads=1 --format pretty --color never --show-output
      # rust/clippy.toml holds the rules this step enforces, one labelled group each, every group opening with its
      # rule; a sanctioned site carries #[allow(clippy::disallowed_methods, reason = "...")] on its one statement. A path
      # that does not exist on a leg draws a warning there.
      - name: Disallowed methods
        run: cargo clippy --workspace --exclude vt100-ctt --lib --bins --locked -- -A clippy::all -D clippy::disallowed_methods
      - name: Selected Rust bodies
        uses: ./.github/actions/selected-body
        with:
          proofs: --all
      - name: Test the filtered-tests runner
        shell: bash
        run: bash ../scripts/tests/test-filtered-tests.sh "$(cat ../dev/output/iso-sh-ci-path)"

      - name: Parse shell scripts
        working-directory: .
        run: |
          shopt -s globstar nullglob
          rc=0; n=0
          for f in scripts/**/*.sh docs/tools/*.sh; do
            n=$((n + 1))
            if bash -n "$f"; then echo "ok: $f"; else echo "PARSE ERROR: $f"; rc=1; fi
          done
          [ "$n" -gt 0 ] || { echo "no shell scripts found"; rc=1; }
          exit "$rc"

      - name: Test the pure-move check
        working-directory: .
        run: bash scripts/tests/test-moved-check.sh

      - name: Test the rc gate's target claim
        working-directory: .
        run: bash scripts/tests/test-rc-gate-target.sh

      - name: Test bash32.sh's build needs
        working-directory: .
        run: bash scripts/tests/test-bash32.sh

      - name: Test the rc gate's suite result names
        working-directory: .
        run: bash scripts/tests/test-rc-gate-basename.sh

      - name: Test the rc gate's job logs
        working-directory: .
        run: bash scripts/tests/test-rc-gate-logs.sh

      # The bash sibling of the PowerShell topology plan test above: scripts/lib/sot-hosts.sh's sot_topology_plan
      # against the same fake sotd, pure text processing, hermetic and fast.
      - name: Test topology plan (bash)
        timeout-minutes: 5
        run: bash scripts/tests/test-topology-plan.sh
        working-directory: .

      # The runner the build+test jobs put between cargo and each test binary: a binary that hangs ends at its bound
      # with the hung test named, and one that ends keeps its output and exit code. Hermetic, on stand-in binaries.
      - name: Test the test-binary bound
        timeout-minutes: 2
        run: bash scripts/tests/test-test-binary-bound.sh
        working-directory: .

      # The installer suites' real-sotd cases (installer-entry's refusals of sotd install, the path list's agreement,
      # installer-apply's pointer rule) run only when this binary exists: a skipped case is not covered.
      - name: Build sotd for the installer suites
        run: cargo build -p sot-backend --bin sotd --locked

      # The launch library (the daemon ensure, the renders, the bounds) and the bootstrap end to end
      # (installer-entry.sh); hermetic and fast. The install's own decisions are sotd install's unit tests.
      - name: Test installer state (bash)
        timeout-minutes: 5
        env:
          SOT_TEST_SOTD: "${{ github.workspace }}/rust/target/debug/sotd"
        run: bash scripts/tests/installer-state.sh
        working-directory: .

      - name: Test installer wrapper (bash)
        timeout-minutes: 5
        run: bash scripts/tests/installer-wrapper.sh
        working-directory: .

      - name: Test installer apply (bash)
        timeout-minutes: 5
        env:
          SOT_TEST_SOTD: "${{ github.workspace }}/rust/target/debug/sotd"
        run: bash scripts/tests/installer-apply.sh
        working-directory: .

      # A home several hosts share: an update's re-render of sotd.service pins it to the hosts that run sotd before the
      # reload, and a hand enable or disable on another host changes no file.
      - name: Test installer shared home (bash)
        timeout-minutes: 5
        run: bash scripts/tests/installer-shared-home.sh
        working-directory: .

      # release.yml's release-before job picks the release an update smoke starts from: the pick over a fixture list,
      # with the sotd built above (its `update direction` is the one version order).
      - name: Test release-before (bash)
        timeout-minutes: 5
        env:
          SOT_TEST_SOTD: "${{ github.workspace }}/rust/target/debug/sotd"
        run: bash scripts/tests/test-release-before.sh
        working-directory: .

      # release.sh, the cut, in throwaway repos with a scratch origin: its refusals, its restore, and a whole cut.
      - name: Test the release cut (bash)
        timeout-minutes: 5
        run: bash scripts/tests/test-release-cut.sh
        working-directory: .


  p2-e2e:
    name: P2 e2e (real helper, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rust/log/claude-sdk-helper/package-lock.json
      - name: Install helper deps
        working-directory: rust/log/claude-sdk-helper
        run: npm ci
      - name: Test helper
        working-directory: rust/log/claude-sdk-helper
        run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run P2 e2e test
        working-directory: rust
        env:
          SOT_HELPER_E2E: "1"
        run: cargo test -p sot-log --test claude_e2e -- --nocapture

