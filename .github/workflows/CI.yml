name: CI
on:
  # Pushes to main and to pass/** and fix/** branches (and runs by hand) -- not tags, not pull
  # requests (decided 2026-09-08: not the per-PR workflow; see rust.yml). A Julia change meets its
  # Julia jobs on its branch, never first on main.
  # Path-filtered to the Julia packages, the docs and comm/ (the
  # installer reads every comm folder it installs), so a Rust-only change never
  # spends five Julia jobs.
  push:
    branches:
      - main
      - "pass/**"
      - "fix/**"
    paths:
      - "agents/**"
      - "comm/**"
      - "core/**"
      - "julia/**"
      - "rust/backend/src/sidecars/**"
      - "rust/backend/sidecars/**"
      - "docs/**"
      - "src/**"
      - "test/**"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/CI.yml"
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # A pre-release Julia warns and never gates a cut: no lab box runs one, and an alpha can break what a release passes.
    continue-on-error: ${{ matrix.version == 'pre' }}
    # Bounds so a hung step fails within minutes, not at the job's old 60. Figures: the longest job and step
    # of two main runs, with margin (a job 6.3 to 8.9 minutes, a step 2.9 to 7.1, the docs step 5.8).
    timeout-minutes: 15
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          # 1.12 is the product-wide compat floor (ADR 0030, 2026-07-02:
          # "we can require 1.12") — the fleet dogfoods 1.12, and the
          # installer pins juliaup channel 1.12 (the julia bundle is retired).
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # The installed comm wrappers run `sotd comm`: a host with the binary and no running daemon.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the daemon the comm wrappers run
        timeout-minutes: 5
        run: cargo build -p sot-backend --bin sotd --locked
        working-directory: rust
      - uses: julia-actions/julia-runtest@v1
        timeout-minutes: 12
        env:
          SOTD_BIN: ${{ github.workspace }}/rust/target/debug/sotd
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  # ADR 0049, User isolation: every Pluto notebook runs in a Distributed worker that checks a cluster cookie, so
  # another account's connection to a worker port runs nothing. The behaviour is the OS's (loopback sockets, process
  # spawning), so it runs on all three.
  pluto-workers:
    name: Pluto workers - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Instantiate julia/pluto
        timeout-minutes: 5
        run: julia --project=julia/pluto -e 'using Pkg; Pkg.instantiate()'
      - name: Test Pluto's notebook workers
        timeout-minutes: 5
        run: julia --project=julia/pluto julia/pluto/test/runtests.jl
  # ADR 0049, User isolation: wglshow's page carries its assets inside it, so its port answers nothing without a
  # secret, and serving it opens one listener. It needs Bonito, so it has an environment of its own.
  wglshow-pages:
    name: wglshow pages - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Instantiate the wglshow page test
        timeout-minutes: 5
        run: julia --project=julia/repl/test/bonito -e 'using Pkg; Pkg.instantiate()'
      - name: Test wglshow's page
        timeout-minutes: 5
        run: julia --project=julia/repl/test/bonito julia/repl/test/bonito/runtests.jl
  # The real Julia suites live in sub-package environments (the root package
  # is just the ShipTools umbrella/installer). Run each with Pkg.test so CI
  # exercises what actually ships: the plugin ABI (core), the kernel's AST
  # hash + project scan + serve loop, the REPL streaming protocol, and the
  # two tool-backed preview plugins.
  julia-packages:
    name: Julia packages ${{ matrix.version }}
    runs-on: ubuntu-latest
    # As in `test`: the pre-release leg warns and never gates a cut.
    continue-on-error: ${{ matrix.version == 'pre' }}
    timeout-minutes: 12
    permissions:
      actions: write # julia-actions/cache proactive cleanup
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - 'pre'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # pdf-file rasterizes via ghostscript + poppler (pdftoppm/pdfinfo);
      # video-file extracts poster frames via ffmpeg. Their suites skip
      # gracefully when the tools are absent — install them so CI runs the
      # real code paths instead of the skips.
      # The one package list: the cache key and both install paths read it.
      # A hit installs the cached .deb files with no mirror; a miss installs
      # as before, keeping the downloaded files for the cache's save.
      - name: Key the preview tool packages
        id: apt
        env:
          APT_PACKAGES: ghostscript poppler-utils ffmpeg
        run: |
          echo "packages=$APT_PACKAGES" >> "$GITHUB_OUTPUT"
          echo "key=apt-debs-${ImageOS}-${ImageVersion}-$(echo "$APT_PACKAGES" | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore preview tool packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-debs/*.deb
          key: ${{ steps.apt.outputs.key }}
      - name: Install preview tool dependencies (cached)
        if: steps.apt-cache.outputs.cache-hit == 'true'
        timeout-minutes: 2
        run: sudo dpkg -i "$HOME"/apt-debs/*.deb
      - name: Install preview tool dependencies
        if: steps.apt-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p "$HOME/apt-debs"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-debs" ${{ steps.apt.outputs.packages }}
          ls "$HOME"/apt-debs/*.deb > /dev/null
      - name: Test ConceptExplorerCore
        timeout-minutes: 5
        run: julia --project=core -e 'using Pkg; Pkg.instantiate(); Pkg.test(coverage=true)'
      - name: Test ShipToolsKernel
        timeout-minutes: 5
        run: julia --project=julia/kernel -e 'using Pkg; Pkg.instantiate(); Pkg.test(coverage=true)'
      - name: Test ShipToolsRepl
        timeout-minutes: 5
        run: julia --project=julia/repl -e 'using Pkg; Pkg.instantiate(); Pkg.test(coverage=true)'
      - name: Test ShipToolsPDFFile
        timeout-minutes: 5
        run: julia --project=julia/plugins/pdf-file -e 'using Pkg; Pkg.instantiate(); Pkg.test(coverage=true)'
      - name: Test ShipToolsVideoFile
        timeout-minutes: 5
        run: julia --project=julia/plugins/video-file -e 'using Pkg; Pkg.instantiate(); Pkg.test(coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: core/src,julia/kernel/src,julia/repl/src,julia/plugins/pdf-file/src,julia/plugins/video-file/src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # Usually 2 to 10 minutes; makedocs runs the doctests.
    timeout-minutes: 12
    concurrency:
      # Serialize only the DEPLOYING build (main -> gh-pages). A PR/branch
      # docs build deploys nothing, and one repo-wide group made GitHub
      # cancel the older PENDING job whenever any other branch pushed (one
      # running + one pending per group), so PR docs checks came back
      # "cancelled" under fleet load (2026-09-08, #223 twice).
      group: docs-${{ github.repository }}-${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
      cancel-in-progress: false
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # Doctests run inside docs/make.jl (makedocs default, errors on failure)
      # with BOTH documented modules loaded — no standalone doctest step. The
      # single-package template step ran doctest(ShipTools), which walks all of
      # docs/src and dies on the `CurrentModule = ConceptExplorerCore` pages.
      - uses: julia-actions/julia-docdeploy@v1
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
