# gitleaks config, read from the repo root by `gitleaks git` and `gitleaks dir` (the gitleaks workflow passes no --config).
# The default rules stay on. Three values are fixtures in Rust tests, not secrets: a 32-character token (the daemon log,
# relay and window tests) and the page secret in the browser-open test's URL, each allowed only under the generic-api-key
# rule, and a made-up Slack app token, a fixture of the daemon's chat hub tests that pushed branches carry before main
# does, allowed only under the app-token rule. Each is allowed by its exact value.
[extend]
useDefault = true

[[allowlists]]
description = "test fixtures: the 32-character token and the browser-open test's page secret"
targetRules = ["generic-api-key"]
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
  '''^Ab12Cd34Ef56$''',
]

[[allowlists]]
description = "the daemon's chat hub tests: a made-up Slack app token, allowed by its exact value under the app-token rule only"
targetRules = ["slack-app-token"]
regexes = [
  '''^xapp-1-A111-2222-bbbb$''',
]

[[allowlists]]
description = "the chat's fake Slack: two test-only TLS keys (a CA-signed server key and a self-signed rogue key) with no use outside that folder (sot-backend's tests compile them in through the chat crate's test-support feature, which no shipped build resolves)"
targetRules = ["private-key"]
paths = [
  '''^rust/chat/src/fake_slack/(server|rogue)\.key$''',
]
