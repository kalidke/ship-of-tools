[package]
name = "sot-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sot-protocol = { path = "../protocol" }
sot-updater = { path = "../updater" }
# ADR 0042 slice L1a: the capsule workspace runtime (Windows-only in this
# unit) calls `sot_log::state_dir`/`supervisor_client`. Unconditional, not
# `[target.'cfg(windows)'.dependencies]`, matching how `sot-frontend`
# already depends on this same crate (its own `paths::sot_state_dir`
# delegates to `sot_log::state_dir::sot_state_dir` on every platform) --
# sot-log's own Cargo.toml already confines its Windows-only pieces
# (`windows-sys`, `vt100-ctt`) to `[target.'cfg(windows)'.dependencies]`,
# so a non-Windows build of THIS crate pulls in nothing new merely by
# depending on the library.
sot-log = { path = "../log" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
interprocess = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
gethostname = "0.5"
portable-pty = "0.9"
image = { workspace = true }
# PNG `pHYs` CRC validation (ADR 0034 tier 2): corrupt embedded calibration
# must not be trusted. Already in the lock as a transitive dep of `image`'s
# png decoder, so direct use compiles nothing new.
crc32fast = "1"
# Half-open connection reaper (ADR 0027): set SO_KEEPALIVE + TCP_KEEPIDLE/
# INTVL/CNT on accepted TCP sockets so the OS RSTs a vanished peer. Already in
# the lock as a transitive tokio dep, so direct use compiles nothing new.
# `umask(2)` (main.rs, security review) isn't exposed by std; already in the
# lock as a transitive dep, so direct use compiles nothing new.
libc = "0.2"

[[bin]]
name = "sotd"
path = "src/main.rs"

[dev-dependencies]
# `start_paused` test runtime (site_serve's bind-fallback test collapses the
# 10x300ms preferred-port retry loop instead of really sleeping through it).
tokio = { workspace = true, features = ["test-util"] }
# ADR 0042 slice L1a: `tests/capsule_workspaces.rs`'s own isolated
# project/state/config roots (matching `sot-log`'s own dev-dependency use).
tempfile = { workspace = true }
