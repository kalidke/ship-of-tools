[package]
name = "sot-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Test-only controls for tests/daemon_lifetime (phase barriers in the supervisor and the native launcher). Never in an
# installed build: nothing enables it but a test run that asks for it by name.
daemon-lifetime-faults = ["sot-log/native-barrier"]

[dependencies]
sot-protocol = { path = "../protocol" }
sot-updater = { path = "../updater" }
sot-log = { path = "../log" }
# The comm wake reads a cell's dim attribute off the capsule screen (`comm::wake::screen::free_test_lines`).
vt100-ctt = "0.17"
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
notify = { workspace = true }
interprocess = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
futures-util = "0.3"
getrandom = "0.3"
gethostname = "0.5"
portable-pty = "0.9"
image = { workspace = true }
# PNG `pHYs` CRC validation (ADR 0034 tier 2): corrupt embedded calibration
# must not be trusted. Already in the lock as a transitive dep of `image`'s
# png decoder, so direct use compiles nothing new.
crc32fast = "1"
# Half-open connection reaper (ADR 0027): set SO_KEEPALIVE + TCP_KEEPIDLE/
# INTVL/CNT on accepted TCP sockets so the OS RSTs a vanished peer. Already in
# the lock as a transitive tokio dep, so direct use compiles nothing new.
# `umask(2)` (main.rs, security review) isn't exposed by std; already in the
# lock as a transitive dep, so direct use compiles nothing new.
libc = "0.2"
# ADR 0046 decision 2 R3: voyage ids compare as `Uuid` (UUIDv7 is
# time-ordered) in the phase cell's own identity-based rejection.
# Already in the lock as a transitive dep of `sot-log`, so direct use
# compiles nothing new.
uuid = { workspace = true }
# A Julia child's own temporary folder (`sidecars::child_tmp`), removed after its reap. Already in the lock as a
# dev dependency, so direct use compiles nothing new.
tempfile = { workspace = true }

# ADR 0046 decision 2 R3: the watchdog's own zero-network identity read
# of a child it just spawned itself needs `HANDLE` to call `sot_log::identity::challenge_win::
# creation_filetime_bits` directly -- the same version already pinned
# under `[target.'cfg(windows)'.dev-dependencies]` below, promoted to a
# real (non-dev) dependency since production code now names the type too.
[target.'cfg(windows)'.dependencies]
# `Win32_System_JobObjects`: lifecycle/contain.rs's per-child job.
# `Win32_System_Registry`: comm/mail/inbox.rs's machine id (`MachineGuid`).
# `Win32_System_Diagnostics_ToolHelp` + `Win32_System_Threading`: comm/registry/ancestors.rs's
# process snapshot and per-process creation times; `Wdk_System_Threading`: its
# command-line query.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Wdk_System_Threading"] }

[[bin]]
name = "sotd"
path = "src/main.rs"

[dev-dependencies]
# Lane-client fixtures only; resolver 2 keeps this feature out of normal product builds.
sot-protocol = { path = "../protocol", features = ["test-handshake-bound"] }
# `topology/dial.rs`'s Windows test reads the impersonation level a pipe server gets (`identity::impersonation_probe`).
# `test_log`, `test_exec::write_executable` and `test_scan::rust_sources()` (dev-only: resolver 2 keeps the feature out of builds).
sot-log = { path = "../log", features = ["test-support"] }
# `start_paused` test runtime (pages::site's bind-fallback test collapses the
# 10x300ms preferred-port retry loop instead of really sleeping through it).
tokio = { workspace = true, features = ["test-util"] }

# ADR 0043 decision 32: `tests/capsule_workspaces/main.rs`'s own Windows-only
# breakaway-containment test stands up a real job object, assigns the
# spawned `sotd` to it directly (`AssignProcessToJobObject`/`CreateJobObjectW`),
# and confirms the contained supervisor via `OpenProcess`/`IsProcessInJob` —
# `sot-log` already depends on `windows-sys` with these same features, but a
# dependency is not transitively `use`-able, so the test needs its own.
# `Win32_Storage_FileSystem`/`Win32_Security`/`Win32_Security_Authorization`
# added for `server/listen.rs`'s own session-pipe ACL test (the `GetSecurityInfo`/
# SDDL round-trip `sot-log`'s `tests/pipe_win/` already uses for its twin
# test on the voyage/supervisor pipes) — same feature set that crate's own
# Cargo.toml lists for the identical purpose.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

# ADR 0043 decision 32 (lane L2): `tests/capsule_workspaces/main.rs` names its
# scratch `systemd-run --user --unit` uniquely per run (same reasoning as
# the Windows dev-dependency just above).
[target.'cfg(target_os = "linux")'.dev-dependencies]
uuid = { workspace = true }
