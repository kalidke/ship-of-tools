# 2026-09-24, diagnostic-then-fix: on THIS box the multiplexed ssh master
# carries no command. The identical ssh WITHOUT ControlMaster/ControlPath
# connects, bridges and exits 0 instantly; with them the bridge instance hangs
# silently with nothing on stderr, and every client retry leaves another one
# behind. The sibling Windows box works fine multiplexed, so this is per-box
# until the difference is understood. Cost: one ssh login per bridge
# connection instead of a channel on a shared one.
[Service]
ExecStart=
ExecStart=/usr/bin/ssh -T -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 ${SOT_RELAY_TARGET} ${SOT_RELAY_SOTD} stdio-bridge --label ${SOT_RELAY_LABEL}
