# VENDORED FORK (ADR 0041 build-order step 3). Upstream: vt100-ctt 0.17.1
# (ChrisTitusTech/vt100-rust, itself a fork of doy/vt100-rust), MIT. Wired
# over the registry crate via [patch.crates-io] in the workspace root, so
# dependents keep their `package = "vt100-ctt"` lines unchanged. This copy
# adds the capsule checkpoint/restore (ADR 0041 §terminal state) — the
# reason the project owns the fork — and removes the escape-sequence WRITING
# stack (`term.rs`, the `*_formatted`/`*_diff` API) that ADR 0041 rejects,
# along with the ratatui glue behind the old `tui-term` feature. Keep the
# version equal to the upstream release it vendors; local changes ride the
# workspace, not crates.io. CHANGELOG.md records the provenance and the
# three differences from upstream, including the one parser behavior change.

[package]
name = "vt100-ctt"
version = "0.17.1"
edition = "2021"
rust-version = "1.70"
authors = [
    "Chris Titus <contact@christitus.com>",
    "Jesse Luehrs <doy@tozt.net>",
]
description = "Library for parsing terminal data (Ship of Tools vendored fork with capsule checkpoint/restore)"
license = "MIT"

[lib]
name = "vt100_ctt"
path = "src/lib.rs"

[dependencies]
unicode-width = "0.2.0"
vte = "0.13.0"

# Test-only: the vendored upstream fixture corpus stores each expected screen
# as JSON (`tests/data/fixtures/`). Nothing in the library serializes.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
