[package]
name = "sot-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
# The byte pipe logs which side closed first.
tracing = { workspace = true }
# Platform: the host name and OS account a hello declares, the runtime folder a session socket lives in.
sot-platform = { path = "../platform" }

[features]
# `ChatRecord::fixture`, for the tests of the crates that build a record. Enabled only by a dev-dependency of another
# crate; `scripts/tests/release-features-check.sh` fails if a shipped binary's resolution has it.
test-support = []

[dev-dependencies]
# The shell hello test runs the shell client in a scratch home of its own.
tempfile = { workspace = true }
sot-platform = { path = "../platform", features = ["test-support"] }
