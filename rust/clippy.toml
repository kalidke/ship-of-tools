# The methods below are disallowed in every library and binary. rust.yml's "Disallowed methods" step runs `cargo clippy
# --workspace --exclude vt100-ctt --lib --bins --locked -- -A clippy::all -D clippy::disallowed_methods` on all three
# platforms, and a lane's merge gate runs the same line on the merged tree (.github/CLAUDE.md). One array in labelled
# groups, each opening with its rule; a new rule is a new group. A sanctioned site carries
# #[allow(clippy::disallowed_methods, reason = "...")] on the one statement that calls the method. A path that does not
# exist on a platform draws a warning there, never an error.
disallowed-methods = [
  # Local endpoint dials (ADR 0049, User isolation): a Rust process reaches a local socket or pipe by name only through
  # sot_log::identity::connect_own. A new connector method joins this group. Not expressible here:
  # std::fs::OpenOptions::open on a pipe path; rust/log/tests/connect_own.rs only checks that net/transport/mod.rs and
  # topology/dial.rs contain the rule's names, not their order and not any other file's opener.
  { path = "std::os::unix::net::UnixStream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "std::os::unix::net::UnixStream::connect_addr", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
