# ADR 0049, User isolation: a Rust process reaches a local socket or pipe by name only through
# sot_log::identity::connect_own, so every connector named below is disallowed outside the sanctioned sites. A sanctioned site
# carries #[allow(clippy::disallowed_methods, reason = "...")]. rust.yml's "Local endpoint dials" step runs the lint over
# every library and binary on all three platforms. Paths that do not exist on a platform draw a warning there, never an
# error. Not expressible here: std::fs::OpenOptions::open on a pipe path; rust/log/tests/connect_own.rs only checks that
# net/transport/mod.rs and topology/dial.rs contain the rule's names, not their order and not any other file's opener.
disallowed-methods = [
  { path = "std::os::unix::net::UnixStream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "std::os::unix::net::UnixStream::connect_addr", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "tokio::net::UnixStream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "interprocess::local_socket::traits::Stream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "interprocess::local_socket::traits::tokio::Stream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "interprocess::local_socket::ConnectOptions::connect_sync", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "interprocess::local_socket::ConnectOptions::connect_tokio", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "tokio::net::windows::named_pipe::ClientOptions::open", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "windows_sys::Win32::Storage::FileSystem::CreateFileW", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "libc::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "sot_log::lane::socket_unix::client::connect_unix_socket_unchallenged", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "sot_log::lane::pipe_win::client::connect_pipe_path_unchallenged", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "sot_log::lane::pipe_win::client::connect_named_pipe_unchallenged", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
]
