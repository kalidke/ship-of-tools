# The methods below are disallowed in every library, binary and build script. rust.yml's "Disallowed methods" step runs
# `cargo clippy --workspace --exclude vt100-ctt --lib --bins --locked -- -A clippy::all -D clippy::disallowed_methods`
# on all three platforms, and a lane's merge gate runs the same line on the merged tree (.github/CLAUDE.md). One array
# in labelled groups, each opening with its rule; a new rule is a new group. A sanctioned site carries
# #[allow(clippy::disallowed_methods, reason = "...")] on the one statement that calls the method. A path that does not
# exist on a platform draws a warning there, never an error.
disallowed-methods = [
