# ADR 0049, User isolation: one lint over two kinds of endpoint call. rust.yml's "Dials and accepts" step runs it over
# every library and binary on all three platforms, and a lane's merge gate runs the same line (.github/CLAUDE.md). A
# sanctioned site carries #[allow(clippy::disallowed_methods, reason = "...")] on the one statement that dials or
# accepts. A path that does not exist on a platform draws a warning there, never an error.
# - Local endpoint dials: a Rust process reaches a local socket or pipe by name only through
#   sot_log::identity::connect_own, so every connector the first group names is disallowed outside the sanctioned sites.
#   A new connector method joins it. Not expressible here: std::fs::OpenOptions::open on a pipe path;
#   rust/log/tests/connect_own.rs only checks that net/transport/mod.rs and topology/dial.rs contain the rule's names,
#   not their order and not any other file's opener.
# - Accepts: every listener a Rust process accepts on is listed. Each accept primitive the second group names is
#   disallowed; each production accept carries one allow whose reason begins "listener: <name>:", and
#   rust/log/tests/isolation_guards.rs (every_rust_listener_is_listed) pins those names. The one TCP accept is
#   sot_log::identity::peer_owner's `serve` (serve_own).
disallowed-methods = [
  # Local endpoint dials: only through sot_log::identity::connect_own.
  { path = "std::os::unix::net::UnixStream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "std::os::unix::net::UnixStream::connect_addr", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "tokio::net::UnixStream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "tokio::net::UnixSocket::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
