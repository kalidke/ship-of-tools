  # Inheritable handles: on Windows a child started while a handle is open and inheritable holds it until the
  # child ends. tokio's TcpListener::bind, TcpStream::connect and UdpSocket::bind make their socket through mio,
  # which leaves it inheritable; tokio's TcpSocket and std do not. Accepted sockets are cleared at accept
  # (serve_own, the accepts group). Two constructors of this class that take raw security attributes are listed
  # once, in the group of their first rule, with a reason naming both: tokio's
  # ServerOptions::create_with_security_attributes_raw under Accepts and ClientOptions::open_with_security_attributes_raw
  # under Local endpoint dials; the other constructors under those groups that take security attributes or an
  # inheritable option (windows-sys's CreateNamedPipeW, CreateNamedPipeA and CreateFile functions, interprocess's
  # PipeListenerOptions) are held by those groups' rules alone. tokio::net::TcpStream::connect is listed once, in
  # the TCP dials group. The rule holds exactly the constructors listed; what it does not hold is named in
  # rust/backend/src/lifecycle/CLAUDE.md.
  { path = "tokio::net::TcpListener::bind", reason = "a socket or pipe made this way is inheritable on Windows: make a socket with tokio's TcpSocket or through std and from_std; make a pipe with null security attributes" },
  { path = "tokio::net::UdpSocket::bind", reason = "a socket or pipe made this way is inheritable on Windows: make a socket with tokio's TcpSocket or through std and from_std; make a pipe with null security attributes" },
