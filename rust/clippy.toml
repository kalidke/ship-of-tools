  { path = "libc::accept", reason = "accept only through sot_log::identity::peer_owner::serve_own (ADR 0049, User isolation)" },
  { path = "libc::accept4", reason = "accept only through sot_log::identity::peer_owner::serve_own (ADR 0049, User isolation)" },
  { path = "std::os::unix::net::UnixListener::accept", reason = "a listener is listed in rust/log/tests/isolation_guards.rs, its allow naming its guard (ADR 0049, User isolation)" },
  { path = "std::os::unix::net::UnixListener::incoming", reason = "a listener is listed in rust/log/tests/isolation_guards.rs, its allow naming its guard (ADR 0049, User isolation)" },
  { path = "tokio::net::UnixListener::accept", reason = "a listener is listed in rust/log/tests/isolation_guards.rs, its allow naming its guard (ADR 0049, User isolation)" },
