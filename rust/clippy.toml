  # File locks: a lock is held only in a guard whose Drop unlocks it (sot_log::host's WriterLock, the backend's
  # comm::mail::inbox InboxLock), because a forked child that has not yet exec'd shares the lock's open file
  # description. So std::fs::File's lock methods and libc::flock are disallowed too, outside those guards.
  # fcntl's F_SETLK, F_SETLKW and F_OFD_SETLK are arguments, not methods: this lint cannot see them, and no code uses them.
  { path = "std::fs::File::lock", reason = "hold a kernel file lock in a guard whose Drop unlocks (sot_log::host::WriterLock, comm::mail::inbox::InboxLock)" },
  { path = "std::fs::File::try_lock", reason = "hold a kernel file lock in a guard whose Drop unlocks (sot_log::host::WriterLock, comm::mail::inbox::InboxLock)" },
