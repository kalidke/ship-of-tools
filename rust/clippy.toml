  { path = "interprocess::local_socket::traits::Stream::from_options", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "interprocess::local_socket::traits::tokio::Stream::connect", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "interprocess::local_socket::traits::tokio::Stream::from_options", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
  { path = "interprocess::local_socket::ConnectOptions::connect_sync", reason = "reach a local endpoint through sot_log::identity::connect_own (ADR 0049, User isolation)" },
