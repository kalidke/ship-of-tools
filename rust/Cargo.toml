[workspace]
resolver = "2"
members = [
    "protocol",
    "backend",
    "frontend",
    "updater",
    "log",
    "vt100",
]

[workspace.package]
version = "0.5.9"
edition = "2021"
authors = ["kalidke"]
license = "MIT"

[workspace.dependencies]
# Async + plumbing
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "net", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
interprocess = { version = "2", features = ["tokio"] }
anyhow = "1"
sha2 = "0.10"
crc32c = "0.6"
uuid = { version = "1", features = ["v7"] }
libc = "0.2"
tempfile = "3"

# Frontend rendering stack (per ADR 0012). NOT terminal-based; we own the renderer.
ratatui = { version = "0.29", default-features = false }
winit = "0.30"
wgpu = "23"
cosmic-text = "0.12"
glyphon = "0.7"
image = "0.25"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
comrak = { version = "0.31", default-features = false }
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
bytemuck_derive = "1.9"

# The project-owned vt100 fork (ADR 0041 step 3): every dependent's
# `package = "vt100-ctt"` line resolves to the vendored copy in rust/vt100
# instead of the registry release it forked from.
[patch.crates-io]
vt100-ctt = { path = "vt100" }
