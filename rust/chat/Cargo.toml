[package]
name = "sot-chat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sot-protocol = { path = "../protocol" }
sot-platform = { path = "../platform" }
toml = "1.1.2"
serde_json = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
# The fake Slack's TLS acceptor, only under `test-support`.
tokio-rustls = { workspace = true, optional = true }

[features]
# The fake Slack (`fake_slack`) and `Http::for_test`: a client that trusts the fixture CA, and a server key committed to this repository that
# lets anyone impersonate the fixture's Slack hosts to it.
# Enabled only by a dev-dependency of another crate; `scripts/tests/release-features-check.sh` fails if a shipped binary's
# resolution has it.
test-support = ["dep:tokio-rustls"]

[dev-dependencies]
# `ChatRecord::fixture` (dev-only; the release-features check keeps the feature out of shipped binaries).
sot-protocol = { path = "../protocol", features = ["test-support"] }
tokio-rustls = { workspace = true }
sot-platform = { path = "../platform", features = ["test-support"] }
