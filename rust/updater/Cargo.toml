[package]
name = "sot-updater"
description = "Ship of Tools release discovery, verification, and staging primitives (ADR 0030 Phase C)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
gethostname = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# `host::HeldDir` and `host::remove_ended`: the release check's scratch folder (`fetch::latest`).
sot-platform = { path = "../platform" }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
# `test_isolated` and `test_wait`: the one way a test re-runs its binary and bounds a wait.
sot-platform = { path = "../platform", features = ["test-support"] }
