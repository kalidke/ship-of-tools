[package]
name = "sot-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# The birth observer and the test helpers every crate's tests share (`test_wait`, `test_isolated`, `test_exec`), for tests of crates
# above this one. The unit tests here get them through the self-referential dev-dependency below.
test-support = []
# Test-only phase barriers (the native launcher's child branch, the supervisor's fence claim). Never in an installed
# build: the backend's `daemon-lifetime-faults` feature forwards it, and nothing else enables it.
native-barrier = []

[dependencies]
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = "2"
# `host_name()` is the one declared-identity resolver (hello, logs, display -- never a routing key or an on-disk address).
gethostname = "0.5"
getrandom = { version = "0.3", features = ["std"] } # std: the io::Error From impl
# `identity::peer_owner::serve_own`, the one TCP accept loop (ADR 0049, User isolation).
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Raw Win32 for the durability arms (MoveFileExW, GetVolumeInformationByHandleW, FILE_FLAG_BACKUP_SEMANTICS), the
# atomic-DACL-at-birth arm (SECURITY_ATTRIBUTES, TokenUser, the SDDL conversions), the process-birth and challenge
# calls (Threading), the pipe challenge (Pipes, IO) and GetExtendedTcpTable (identity/peer_owner, decision 0031).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
] }

[build-dependencies]
# The native launcher (src/host/process_tree/native_birth.c).
cc = "1"

[dev-dependencies]
tempfile = { workspace = true }
sot-platform = { path = ".", features = ["test-support"] }
