[package]
name = "sot-log"
description = "Ship's Log voyage store: frame codec + segment format (ADR 0037/0039)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
crc32c = { workspace = true }
uuid = { workspace = true }
thiserror = "2"
getrandom = { version = "0.3", features = ["std"] } # std: the io::Error From impl

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Raw Win32 for the durability arms (ADR 0041 §store port): MoveFileExW,
# GetVolumeInformationByHandleW, FILE_FLAG_BACKUP_SEMANTICS. Plus the
# atomic-DACL-at-birth arm (ADR 0041 "attach protocol" §Security split):
# Win32_Security for SECURITY_ATTRIBUTES/GetTokenInformation/TokenUser,
# Win32_Security_Authorization for the SDDL conversions, Win32_System_Threading
# for OpenProcessToken/GetCurrentProcess. Same version the frontend pins.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
