[package]
name = "sot-log"
description = "Ship's Log voyage store: frame codec + segment format (ADR 0037/0039)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
crc32c = { workspace = true }
uuid = { workspace = true }
thiserror = "2"
getrandom = { version = "0.3", features = ["std"] } # std: the io::Error From impl

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The live vt100 parser the capsule runtime keeps across the run (ADR 0041
# "Terminal state"): windows-gated because capsule_win.rs is its only
# consumer — the fork builds everywhere, but a dependency should live where
# the thing that needs it lives. Unaliased, matching the workspace patch
# (`[patch.crates-io] vt100-ctt = { path = "vt100" }`); this crate has no
# existing `vt100` name to collide with, so no `package =` rename either.
vt100-ctt = "0.17"
# Raw Win32 for the durability arms (ADR 0041 §store port): MoveFileExW,
# GetVolumeInformationByHandleW, FILE_FLAG_BACKUP_SEMANTICS. Plus the
# atomic-DACL-at-birth arm (ADR 0041 "attach protocol" §Security split):
# Win32_Security for SECURITY_ATTRIBUTES/GetTokenInformation/TokenUser,
# Win32_Security_Authorization for the SDDL conversions, Win32_System_Threading
# for OpenProcessToken/GetCurrentProcess/CreateProcessW/the attribute-list
# calls. Plus the owned-ConPTY layer (ADR 0041 "Containment and the owned
# ConPTY layer"): Win32_System_Console for CreatePseudoConsole/Resize/Close,
# Win32_System_JobObjects for the anonymous containment job, Win32_System_Pipes
# for CreatePipe. Same version the frontend pins.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
# tests/capsule_win.rs's own reference-parser fidelity check (ADR 0041 step
# 5: attach checkpoint + subsequent stream reproduces a from-scratch replay
# byte-for-byte) needs to drive a second, independent `vt100_ctt::Parser` —
# the same crate `capsule_win.rs` itself uses, dev-only here since no
# non-test code in this crate's own target needs it outside the `[target.
# 'cfg(windows)'.dependencies]` entry above.
vt100-ctt = "0.17"
