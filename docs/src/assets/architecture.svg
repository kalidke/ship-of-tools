<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Ship of Tools architecture: frontends connect over one socket to the backend daemon, which supervises the Julia kernel, the REPL and the agent session capsules" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <title>Ship of Tools architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#939dad"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#0f1116"/>

  <!-- your machine -->
  <rect x="24" y="24" width="270" height="422" rx="12" fill="none" stroke="#3b4252" stroke-dasharray="6 5"/>
  <text x="40" y="52" fill="#939dad" font-size="14" font-weight="600">YOUR MACHINE(S)</text>
  <rect x="48" y="80" width="222" height="150" rx="10" fill="#171a21" stroke="#6d8cf0" stroke-width="2"/>
  <text x="64" y="110" fill="#e6e8ee" font-size="18" font-weight="700">Frontend</text>
  <text x="64" y="134" fill="#aab2c0" font-size="13">Rust, winit + wgpu</text>
  <text x="64" y="160" fill="#aab2c0" font-size="13">native window, previews,</text>
  <text x="64" y="178" fill="#aab2c0" font-size="13">keyboard; no project state</text>
  <text x="64" y="206" fill="#aab2c0" font-size="13">+ local Terminal drawer</text>
  <rect x="48" y="258" width="222" height="70" rx="10" fill="#171a21" stroke="#3b4252"/>
  <text x="64" y="288" fill="#e6e8ee" font-size="16" font-weight="600">Second frontend</text>
  <text x="64" y="310" fill="#aab2c0" font-size="13">laptop + desktop, same backend</text>
  <rect x="48" y="352" width="222" height="70" rx="10" fill="#171a21" stroke="#3b4252"/>
  <text x="64" y="382" fill="#e6e8ee" font-size="16" font-weight="600">Browser</text>
  <text x="64" y="404" fill="#aab2c0" font-size="13">wglshow, Pluto, video, HTML</text>

  <!-- socket boundary -->
  <line x1="330" y1="36" x2="330" y2="436" stroke="#6d8cf0" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="340" y="66" fill="#6d8cf0" font-size="13" font-weight="600">one socket</text>
  <text x="340" y="84" fill="#939dad" font-size="12">SSH-forwarded, or</text>
  <text x="340" y="100" fill="#939dad" font-size="12">local on one box</text>
  <text x="340" y="118" fill="#939dad" font-size="12">JSON line protocol</text>
  <path d="M270,155 L466,196" stroke="#939dad" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M270,293 L466,216" stroke="#939dad" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M270,387 L466,236" stroke="#939dad" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-start="url(#arr)"/>

  <!-- backend host -->
  <rect x="440" y="24" width="496" height="422" rx="12" fill="none" stroke="#3b4252" stroke-dasharray="6 5"/>
  <text x="456" y="52" fill="#939dad" font-size="14" font-weight="600">BACKEND HOST (local, or your GPU server)</text>
  <rect x="468" y="150" width="200" height="130" rx="10" fill="#171a21" stroke="#6d8cf0" stroke-width="2"/>
  <text x="484" y="180" fill="#e6e8ee" font-size="18" font-weight="700">Daemon (sotd)</text>
  <text x="484" y="204" fill="#aab2c0" font-size="13">Rust, tokio</text>
  <text x="484" y="228" fill="#aab2c0" font-size="13">project state, file watch,</text>
  <text x="484" y="246" fill="#aab2c0" font-size="13">supervision, comm relay,</text>
  <text x="484" y="264" fill="#aab2c0" font-size="13">browser proxy</text>

  <rect x="712" y="72" width="204" height="92" rx="10" fill="#171a21" stroke="#9558b2" stroke-width="2"/>
  <text x="728" y="100" fill="#e6e8ee" font-size="16" font-weight="700">Julia kernel</text>
  <text x="728" y="122" fill="#aab2c0" font-size="13">one per workspace; FileType</text>
  <text x="728" y="140" fill="#aab2c0" font-size="13">dispatch, previews, modules</text>

  <rect x="712" y="186" width="204" height="80" rx="10" fill="#171a21" stroke="#389826" stroke-width="2"/>
  <text x="728" y="214" fill="#e6e8ee" font-size="16" font-weight="700">Julia REPL</text>
  <text x="728" y="236" fill="#aab2c0" font-size="13">your session; figures sent</text>
  <text x="728" y="254" fill="#aab2c0" font-size="13">as structured frames</text>

  <rect x="712" y="288" width="204" height="136" rx="10" fill="#171a21" stroke="#cb3c33" stroke-width="2"/>
  <text x="728" y="316" fill="#e6e8ee" font-size="16" font-weight="700">Agent sessions</text>
  <text x="728" y="338" fill="#aab2c0" font-size="13">Claude Code, Codex, shell</text>
  <text x="728" y="360" fill="#aab2c0" font-size="13">each in its own capsule</text>
  <text x="728" y="382" fill="#aab2c0" font-size="13">supervisor; survives FE</text>
  <text x="728" y="400" fill="#aab2c0" font-size="13">and daemon restarts</text>

  <path d="M668,190 L710,122" stroke="#939dad" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M668,220 L710,224" stroke="#939dad" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M668,256 L710,340" stroke="#939dad" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  <text x="560" y="330" fill="#939dad" font-size="12">starts, lists,</text>
  <text x="560" y="346" fill="#939dad" font-size="12">re-adopts</text>
</svg>
